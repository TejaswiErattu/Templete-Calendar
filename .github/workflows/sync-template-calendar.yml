name: Sync Template Calendar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-template-calendar.yml'

permissions:
  contents: write

concurrency:
  group: template-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Template Calendar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read Summer activity
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SOURCE_FIREBASE_USER_UID: ${{ secrets.SOURCE_FIREBASE_USER_UID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-template-calendar.mjs

      - name: Commit new Template Calendar state
        run: |
          if [ -z "$(git status --porcelain -- .template-calendar-state.json TEMPLATE_CALENDAR.md template-calendar.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "template-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .template-calendar-state.json TEMPLATE_CALENDAR.md template-calendar.json
          git commit -m "chore: sync Template Calendar"
          git push origin HEAD:main
